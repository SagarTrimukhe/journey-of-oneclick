apiVersion: apps/v1
kind: Deployment
metadata:
  name: books-service-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: books-service
  template:
    metadata:
      labels:
        app: books-service
    spec:
      containers:
      - name: books-svc
        image: sagardev/books:1.0
        ports:
        - containerPort: 3000
        resources:
          requests:
            memory: "500Mi"
            cpu: "500m"
          limits:
            memory: "800Mi"
            cpu: "800m"

